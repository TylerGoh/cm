[project]
name = "agent"
version = "0.1.0"
description = "Supervises the worker on one box: heartbeats to the cluster manager and drives the worker to the desired state"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "elasticsearch>=8.13,<9",   # its httpx node; the major version must match the Elastic cluster
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent = "agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
