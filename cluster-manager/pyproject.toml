[project]
name = "cluster-manager"
version = "0.1.0"
description = "The cluster manager daemon and its CLI, cm"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",              # cm reads PORT from .env
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cm = "cluster_manager.client.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cluster_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
